<div id="home-container" class="flex flex-column align-items-center">

  <div id="img-main" class="flex w-full mb-6"></div>

  <p class="text-justify sm:text-center text-xl px-3 md:px-8 mb-8" [innerHTML]="testoMain"></p>

  <div class="felx-column sm:flex w-full mt-3 xl:mt-8 mb-8">
    <p class="sm:hidden text-3xl font-bold text-center w-full mb-6">TRUCCO SPOSA</p>

    <div id="img-sposa" class="flex mb-5 sm:mr-6 sm:mb-0"></div>
    <div class="flex flex-column w-full">
      <p class="hidden sm:block text-3xl font-bold text-center sm:text-start w-full mb-6">TRUCCO SPOSA</p>
      <p class="flex-1 text-lg text-justify" >{{ testoSposa }}</p>
    </div>
  </div>

  <div class="felx-column sm:flex w-full mt-3 xl:mt-8">

    <div class="flex flex-column w-full">
      <p class="text-3xl font-bold text-center sm:text-start w-full mb-6">TRUCCO MODA</p>
      <p class="hidden text-lg sm:block text-justify" >{{ testoModa }}</p>
    </div>

    <div id="img-moda" class="flex mb-5 sm:ml-6 sm:mb-0"></div>

    <p class="sm:hidden text-lg flex flex-1 text-justify" >{{ testoModa }}</p>

  </div>

</div>
